name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest backend/tests
      - name: Run Ruff
        run: python -m ruff check backend

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Run ESLint
        run: pnpm --dir frontend lint
      - name: Run frontend tests
        run: pnpm --dir frontend test
      - name: Build frontend
        run: pnpm --dir frontend build

  contracts:
    name: Contract and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend
      - frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Check OpenAPI and generated types
        run: python scripts/check_openapi.py
      - name: Check dependency pins
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path("backend").glob("requirements*.txt"):
              for line_number, raw_line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  line = raw_line.strip()
                  if not line or line.startswith(("#", "-r")):
                      continue
                  if not re.search(r"==[^;#\s]+", line):
                      raise SystemExit(f"Unpinned requirement: {path}:{line_number}: {line}")
          PY
      - name: Check generated license inventory
        run: '! grep -n "未安装" docs/DEPENDENCY_LICENSES.md'
