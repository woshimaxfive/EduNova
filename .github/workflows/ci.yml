name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest backend/tests
      - name: Run Ruff
        run: python -m ruff check backend

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Run ESLint
        run: pnpm --dir frontend lint
      - name: Run frontend tests
        run: pnpm --dir frontend test
      - name: Build frontend
        run: pnpm --dir frontend build

  code-verifier:
    name: Code verifier policy regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code-verifier/package-lock.json
      - name: Install locked verifier dependencies
        working-directory: code-verifier
        run: npm ci --ignore-scripts --omit=dev --no-audit
      - name: Exercise real Pyodide policy
        working-directory: code-verifier
        run: npm test

  desktop-windows:
    name: Windows desktop lifecycle and packaging guards
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements-desktop.txt
      - name: Install backend and Windows lifecycle dependencies
        run: python -m pip install -r backend/requirements-dev.txt -r backend/requirements-desktop.txt
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run Windows lifecycle and installation regressions
        run: python -m pytest backend/tests/test_desktop_runtime.py backend/tests/test_desktop_prepare.py backend/tests/test_desktop_host_bridge.py backend/tests/test_desktop_app.py backend/tests/test_desktop_payload_notices.py backend/tests/test_docling_backend_selection.py
      - name: Run desktop permission and packaging guards
        run: node --test desktop/test/*.test.cjs
      - name: Check text encoding
        shell: pwsh
        run: ./scripts/verify_encoding.ps1

  contracts:
    name: Contract and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend
      - frontend
      - code-verifier
      - desktop-windows
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Check OpenAPI and generated types
        run: python scripts/check_openapi.py
      - name: Check dependency pins
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path("backend").glob("requirements*.txt"):
              for line_number, raw_line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  line = raw_line.strip()
                  if not line or line.startswith(("#", "-r")):
                      continue
                  if not re.search(r"==[^;#\s]+", line):
                      raise SystemExit(f"Unpinned requirement: {path}:{line_number}: {line}")
          PY
      - name: Check generated license inventory
        run: '! grep -n "未安装" docs/DEPENDENCY_LICENSES.md'
