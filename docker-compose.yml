services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edunova}
      POSTGRES_USER: ${POSTGRES_USER:-edunova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edunova_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edunova}:${POSTGRES_PASSWORD:-edunova_dev_password}@postgres:5432/${POSTGRES_DB:-edunova}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-tavily}
      WEB_SEARCH_ENDPOINT: ${WEB_SEARCH_ENDPOINT:-https://api.tavily.com/search}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      EXPORT_DIR: ${EXPORT_DIR:-storage/exports}
      EXPORT_QUEUE_NAME: ${EXPORT_QUEUE_NAME:-edunova_exports}
      AI_JOB_QUEUE_NAME: ${AI_JOB_QUEUE_NAME:-edunova_ai}
      AI_JOB_TIMEOUT_SECONDS: ${AI_JOB_TIMEOUT_SECONDS:-900}
      AI_JOB_STALE_SECONDS: ${AI_JOB_STALE_SECONDS:-180}
      AI_JOB_MAX_ACTIVE_PER_USER: ${AI_JOB_MAX_ACTIVE_PER_USER:-2}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - export_data:/app/storage/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  export-worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edunova}:${POSTGRES_PASSWORD:-edunova_dev_password}@postgres:5432/${POSTGRES_DB:-edunova}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-tavily}
      WEB_SEARCH_ENDPOINT: ${WEB_SEARCH_ENDPOINT:-https://api.tavily.com/search}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      EXPORT_DIR: ${EXPORT_DIR:-storage/exports}
      EXPORT_QUEUE_NAME: ${EXPORT_QUEUE_NAME:-edunova_exports}
    volumes:
      - export_data:/app/storage/exports
    command: ["sh", "-c", "rq worker $${EXPORT_QUEUE_NAME:-edunova_exports} --url $${REDIS_URL}"]
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edunova}:${POSTGRES_PASSWORD:-edunova_dev_password}@postgres:5432/${POSTGRES_DB:-edunova}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      AI_JOB_QUEUE_NAME: ${AI_JOB_QUEUE_NAME:-edunova_ai}
      AI_JOB_TIMEOUT_SECONDS: ${AI_JOB_TIMEOUT_SECONDS:-900}
      AI_JOB_STALE_SECONDS: ${AI_JOB_STALE_SECONDS:-180}
      AI_JOB_MAX_ACTIVE_PER_USER: ${AI_JOB_MAX_ACTIVE_PER_USER:-2}
    command: ["sh", "-c", "rq worker $${AI_JOB_QUEUE_NAME:-edunova_ai} --url $${REDIS_URL}"]
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    expose:
      - "80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  export_data:
