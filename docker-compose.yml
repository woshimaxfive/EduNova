services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edunova}
      POSTGRES_USER: ${POSTGRES_USER:-edunova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edunova_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edunova}:${POSTGRES_PASSWORD:-edunova_dev_password}@postgres:5432/${POSTGRES_DB:-edunova}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-tavily}
      WEB_SEARCH_ENDPOINT: ${WEB_SEARCH_ENDPOINT:-https://api.tavily.com/search}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      EXPORT_DIR: ${EXPORT_DIR:-storage/exports}
      EXPORT_QUEUE_NAME: ${EXPORT_QUEUE_NAME:-edunova_exports}
      AI_JOB_QUEUE_NAME: ${AI_JOB_QUEUE_NAME:-edunova_ai}
      AI_JOB_TIMEOUT_SECONDS: ${AI_JOB_TIMEOUT_SECONDS:-900}
      AI_JOB_STALE_SECONDS: ${AI_JOB_STALE_SECONDS:-180}
      AI_JOB_MAX_ACTIVE_PER_USER: ${AI_JOB_MAX_ACTIVE_PER_USER:-2}
      SYSTEM_EMBEDDING_APP_ID: ${SYSTEM_EMBEDDING_APP_ID:-}
      SYSTEM_EMBEDDING_API_SECRET: ${SYSTEM_EMBEDDING_API_SECRET:-}
      SYSTEM_EMBEDDING_DIMENSION: ${SYSTEM_EMBEDDING_DIMENSION:-}
      SYSTEM_RERANK_PROVIDER: ${SYSTEM_RERANK_PROVIDER:-}
      SYSTEM_RERANK_BASE_URL: ${SYSTEM_RERANK_BASE_URL:-}
      SYSTEM_RERANK_API_KEY: ${SYSTEM_RERANK_API_KEY:-}
      SYSTEM_RERANK_MODEL: ${SYSTEM_RERANK_MODEL:-}
      SYSTEM_RERANK_WORKSPACE_ID: ${SYSTEM_RERANK_WORKSPACE_ID:-}
      SYSTEM_VISION_PROVIDER: ${SYSTEM_VISION_PROVIDER:-xfyun_vision}
      SYSTEM_VISION_BASE_URL: ${SYSTEM_VISION_BASE_URL:-wss://spark-api.cn-huabei-1.xf-yun.com/v2.1/image}
      SYSTEM_VISION_APP_ID: ${SYSTEM_VISION_APP_ID:-${SYSTEM_EMBEDDING_APP_ID:-}}
      SYSTEM_VISION_API_KEY: ${SYSTEM_VISION_API_KEY:-${SYSTEM_EMBEDDING_API_KEY:-}}
      SYSTEM_VISION_API_SECRET: ${SYSTEM_VISION_API_SECRET:-${SYSTEM_EMBEDDING_API_SECRET:-}}
      SYSTEM_VISION_MODEL: ${SYSTEM_VISION_MODEL:-imagev3}
      VISION_REQUEST_TIMEOUT_SECONDS: ${VISION_REQUEST_TIMEOUT_SECONDS:-60}
      MODEL_MAX_ATTEMPTS: ${MODEL_MAX_ATTEMPTS:-3}
      MODEL_RETRY_BASE_DELAY_SECONDS: ${MODEL_RETRY_BASE_DELAY_SECONDS:-0.5}
      MODEL_RETRY_MAX_DELAY_SECONDS: ${MODEL_RETRY_MAX_DELAY_SECONDS:-2}
      MODEL_RETRY_AFTER_MAX_SECONDS: ${MODEL_RETRY_AFTER_MAX_SECONDS:-3}
      MODEL_CIRCUIT_FAILURE_THRESHOLD: ${MODEL_CIRCUIT_FAILURE_THRESHOLD:-5}
      MODEL_CIRCUIT_WINDOW_SECONDS: ${MODEL_CIRCUIT_WINDOW_SECONDS:-60}
      MODEL_CIRCUIT_OPEN_SECONDS: ${MODEL_CIRCUIT_OPEN_SECONDS:-60}
      MODEL_MAX_CONCURRENT_PER_USER: ${MODEL_MAX_CONCURRENT_PER_USER:-3}
      MODEL_MAX_CONCURRENT_GLOBAL: ${MODEL_MAX_CONCURRENT_GLOBAL:-12}
      MODEL_CONCURRENCY_WAIT_SECONDS: ${MODEL_CONCURRENCY_WAIT_SECONDS:-2}
      MODEL_CALL_LOG_RETENTION_DAYS: ${MODEL_CALL_LOG_RETENTION_DAYS:-30}
      CODE_VERIFIER_URL: http://code-verifier:8090
      CODE_VERIFIER_TIMEOUT_SECONDS: ${CODE_VERIFIER_TIMEOUT_SECONDS:-40}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      CHAT_ATTACHMENT_STORAGE_DIR: ${CHAT_ATTACHMENT_STORAGE_DIR:-var/uploads/chat-attachments}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - export_data:/app/storage/exports
      - material_data:/app/var/uploads/materials
      - chat_attachment_data:/app/var/uploads/chat-attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      code-verifier:
        condition: service_healthy
    networks:
      - default
      - verification_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  export-worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edunova}:${POSTGRES_PASSWORD:-edunova_dev_password}@postgres:5432/${POSTGRES_DB:-edunova}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-tavily}
      WEB_SEARCH_ENDPOINT: ${WEB_SEARCH_ENDPOINT:-https://api.tavily.com/search}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      EXPORT_DIR: ${EXPORT_DIR:-storage/exports}
      EXPORT_QUEUE_NAME: ${EXPORT_QUEUE_NAME:-edunova_exports}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      CHAT_ATTACHMENT_STORAGE_DIR: ${CHAT_ATTACHMENT_STORAGE_DIR:-var/uploads/chat-attachments}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - export_data:/app/storage/exports
    command: ["sh", "-c", "rq worker $${EXPORT_QUEUE_NAME:-edunova_exports} --url $${REDIS_URL}"]
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: ai-worker
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_VERSION: ${TORCH_VERSION:-2.13.0+cpu}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION:-0.28.0+cpu}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edunova}:${POSTGRES_PASSWORD:-edunova_dev_password}@postgres:5432/${POSTGRES_DB:-edunova}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      AI_JOB_QUEUE_NAME: ${AI_JOB_QUEUE_NAME:-edunova_ai}
      AI_JOB_TIMEOUT_SECONDS: ${AI_JOB_TIMEOUT_SECONDS:-900}
      AI_JOB_STALE_SECONDS: ${AI_JOB_STALE_SECONDS:-180}
      AI_JOB_MAX_ACTIVE_PER_USER: ${AI_JOB_MAX_ACTIVE_PER_USER:-2}
      SYSTEM_EMBEDDING_APP_ID: ${SYSTEM_EMBEDDING_APP_ID:-}
      SYSTEM_EMBEDDING_API_SECRET: ${SYSTEM_EMBEDDING_API_SECRET:-}
      SYSTEM_EMBEDDING_DIMENSION: ${SYSTEM_EMBEDDING_DIMENSION:-}
      SYSTEM_RERANK_PROVIDER: ${SYSTEM_RERANK_PROVIDER:-}
      SYSTEM_RERANK_BASE_URL: ${SYSTEM_RERANK_BASE_URL:-}
      SYSTEM_RERANK_API_KEY: ${SYSTEM_RERANK_API_KEY:-}
      SYSTEM_RERANK_MODEL: ${SYSTEM_RERANK_MODEL:-}
      SYSTEM_RERANK_WORKSPACE_ID: ${SYSTEM_RERANK_WORKSPACE_ID:-}
      SYSTEM_VISION_PROVIDER: ${SYSTEM_VISION_PROVIDER:-xfyun_vision}
      SYSTEM_VISION_BASE_URL: ${SYSTEM_VISION_BASE_URL:-wss://spark-api.cn-huabei-1.xf-yun.com/v2.1/image}
      SYSTEM_VISION_APP_ID: ${SYSTEM_VISION_APP_ID:-${SYSTEM_EMBEDDING_APP_ID:-}}
      SYSTEM_VISION_API_KEY: ${SYSTEM_VISION_API_KEY:-${SYSTEM_EMBEDDING_API_KEY:-}}
      SYSTEM_VISION_API_SECRET: ${SYSTEM_VISION_API_SECRET:-${SYSTEM_EMBEDDING_API_SECRET:-}}
      SYSTEM_VISION_MODEL: ${SYSTEM_VISION_MODEL:-imagev3}
      VISION_REQUEST_TIMEOUT_SECONDS: ${VISION_REQUEST_TIMEOUT_SECONDS:-60}
      MODEL_MAX_ATTEMPTS: ${MODEL_MAX_ATTEMPTS:-3}
      MODEL_RETRY_BASE_DELAY_SECONDS: ${MODEL_RETRY_BASE_DELAY_SECONDS:-0.5}
      MODEL_RETRY_MAX_DELAY_SECONDS: ${MODEL_RETRY_MAX_DELAY_SECONDS:-2}
      MODEL_RETRY_AFTER_MAX_SECONDS: ${MODEL_RETRY_AFTER_MAX_SECONDS:-3}
      MODEL_CIRCUIT_FAILURE_THRESHOLD: ${MODEL_CIRCUIT_FAILURE_THRESHOLD:-5}
      MODEL_CIRCUIT_WINDOW_SECONDS: ${MODEL_CIRCUIT_WINDOW_SECONDS:-60}
      MODEL_CIRCUIT_OPEN_SECONDS: ${MODEL_CIRCUIT_OPEN_SECONDS:-60}
      MODEL_MAX_CONCURRENT_PER_USER: ${MODEL_MAX_CONCURRENT_PER_USER:-3}
      MODEL_MAX_CONCURRENT_GLOBAL: ${MODEL_MAX_CONCURRENT_GLOBAL:-12}
      MODEL_CONCURRENCY_WAIT_SECONDS: ${MODEL_CONCURRENCY_WAIT_SECONDS:-2}
      MODEL_CALL_LOG_RETENTION_DAYS: ${MODEL_CALL_LOG_RETENTION_DAYS:-30}
      CODE_VERIFIER_URL: http://code-verifier:8090
      CODE_VERIFIER_TIMEOUT_SECONDS: ${CODE_VERIFIER_TIMEOUT_SECONDS:-40}
      EDUNOVA_DOCUMENT_PARSER: ${EDUNOVA_DOCUMENT_PARSER:-docling}
      DOCLING_ARTIFACTS_PATH: /opt/docling/models
      DOCLING_DOCUMENT_TIMEOUT_SECONDS: ${DOCLING_DOCUMENT_TIMEOUT_SECONDS:-120}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    command: ["sh", "-c", "rq worker $${AI_JOB_QUEUE_NAME:-edunova_ai} --url $${REDIS_URL}"]
    volumes:
      - material_data:/app/var/uploads/materials
      - chat_attachment_data:/app/var/uploads/chat-attachments
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      code-verifier:
        condition: service_healthy
    networks:
      - default
      - verification_net

  code-verifier:
    build:
      context: .
      dockerfile: docker/code-verifier.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      PORT: 8090
      CODE_RUN_TIMEOUT_MS: 5000
      CODE_READY_TIMEOUT_MS: 30000
    expose:
      - "8090"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 0.75
    networks:
      - verification_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8

  clamav:
    image: clamav/clamav:1.4
    profiles: ["security"]
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 10s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  export_data:
  material_data:
  chat_attachment_data:
  clamav_data:

networks:
  verification_net:
    internal: true
