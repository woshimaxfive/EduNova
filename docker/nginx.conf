events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream edunova_frontend {
    zone edunova_frontend 64k;
    server frontend:80 resolve;
  }

  upstream edunova_backend {
    zone edunova_backend 64k;
    server backend:8000 resolve;
  }

  server {
    listen 80;
    server_name _;

    location = /health {
      add_header Content-Type text/plain;
      return 200 "ok";
    }

    location /api/ {
      proxy_pass http://edunova_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://edunova_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
